<body>
    <div class="header">作业王v1.3.0-大家的最爱</div>

    <!-- 公告居中弹窗 -->

    <!-- 右上角保存按钮 -->

        <button id="save-btn" class="action-button">保存</button>
    </div>
    
    <!-- 保存选择对话框 -->

        <div class="modal-content" style="width:340px;">
            <div class="modal-header">
                <h2 class="modal-title">保存选项</h2>
                <button class="close-button" id="save-select-close">&times;</button>

            </div>

    <!-- 左下角公告按钮 -->
    <div id="bottom-notice-btn">公告</div>
    <!-- 公告写字板模态框 -->

        <div class="modal-content" style="width:420px;min-height:320px;max-width:480px;">

                <button class="close-button" id="notice-close">&times;</button>

    <script>
    // 自适应文字颜色函数
    function getAdaptiveTextColor(element) {
        const computedStyle = window.getComputedStyle(element);
        const bgColor = computedStyle.backgroundColor;
        
        // 提取RGB值
        const rgb = bgColor.match(/\d+/g);
        if (!rgb || rgb.length < 3) return '#333';
        
        const r = parseInt(rgb[0]), g = parseInt(rgb[1]), b = parseInt(rgb[2]);
        
        // 计算亮度 (相对亮度公式)
        const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        
        // 如果背景较暗，返回白色文字，否则返回黑色文字
        return brightness < 0.5 ? '#ffffff' : '#333333';
    }

    // 应用自适应文字颜色
    function applyAdaptiveTextColors() {
        const elements = document.querySelectorAll('.modal-title, .form-group label, .homework-item, .action-button, .submit-button, .cancel-button, .delete-confirm-button, .modal-content p');
        
        // 检查是否在纯白背景模式下
        const isWhiteBackground = document.body.classList.contains('liquid-glass-disabled');
        
        elements.forEach(element => {
            let textColor;
            
            if (isWhiteBackground) {
                // 纯白背景模式下，表单元素统一显示黑色
                if (element.classList.contains('modal-title') || 
                    element.classList.contains('form-group') || 
                    element.closest('.form-group') || 
                    element.classList.contains('action-button') ||
                    element.classList.contains('submit-button') ||
                    element.classList.contains('cancel-button') ||
                    element.classList.contains('delete-confirm-button')) {
                    textColor = '#333333';
                } else {
                    // 其他元素保持自适应
                    textColor = getAdaptiveTextColor(element);
                }
            } else {
                // 动态背景模式下，保持自适应
                textColor = getAdaptiveTextColor(element);
            }
            
            element.style.color = textColor;
            
            // 根据文字颜色调整文字阴影
            if (textColor === '#ffffff') {
                element.style.textShadow = '0 1px 2px rgba(0, 0, 0, 0.3)';
            } else {
                element.style.textShadow = '0 1px 2px rgba(0, 0, 0, 0.1)';
            }
        });
    }

    // 公告居中弹窗样式
    (function() {
        const style = document.createElement('style');
        style.innerHTML = `
            #notice-center-modal {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 100vw; height: 100vh;
                background: rgba(0,0,0,0.3);
                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);
                z-index: 2000;
                justify-content: center;
                align-items: flex-end;
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            #notice-center-modal.show {
                opacity: 1;
                align-items: center;
            }
            #notice-center-modal .modal-content {
                background: transparent;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                border-radius: 20px;
                border: 2px solid transparent;
                box-shadow: none;
                padding: 0;
                min-width: 320px;
                max-width: 90vw;
                position: relative;
                transform: translateY(100vh);
                transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            }
            #notice-center-modal .modal-content.is-static {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);
                border: 2px solid rgba(255, 255, 255, 0.8);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            }
            #notice-center-modal.show .modal-content {
                transform: translateY(0);
            }
            #notice-center-close {
                background: none;
                border: none;
                color: rgba(255, 255, 255, 0.8);
                cursor: pointer;
                font-size: 1.7rem;
                transition: color 0.2s;
            }
            #notice-center-close:hover {
                color: white;
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
        `;
        document.head.appendChild(style);
    })();
        // 顶部按钮样式和公告写字板样式
        (function() {
            const style = document.createElement('style');
        style.innerHTML = `
            #notice-display {
                margin: 18px 0 10px 0;
                padding: 14px 22px;
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                border-left: 5px solid rgba(52, 152, 219, 0.7);
                border-radius: 12px;
                font-size: 1.15rem;
                color: #333;
                min-height: 32px;
                width: clamp(280px, 92vw, 900px);
                max-width: 100%;
                box-sizing: border-box;
                word-break: break-all;
                white-space: pre-wrap;
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            }
        `;
            document.head.appendChild(style);
        })();
        (function() {
            const style = document.createElement('style');
        style.innerHTML = `
            #top-btns {
                position: fixed;
                top: 24px;
                right: 38px;
                display: flex;
                gap: 18px;
                z-index: 1020;
            }

                color: #333;
                background: rgba(255, 255, 255, 0.2);

            #bottom-notice-btn {

                -webkit-backdrop-filter: blur(15px);
                font-size: 1.25rem;
                font-weight: bold;
                padding: 8px 22px;
                border-radius: 22px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);

        `;
            document.head.appendChild(style);
        })();
        // 右上角保存按钮样式和点击事件
        (function() {
            const style = document.createElement('style');
        style.innerHTML = `
            #save-btn {
                position: fixed;
                top: 24px;
                right: 38px;
                color: #333;
                background: white;
                font-size: 1.25rem;
                font-weight: bold;

                box-shadow: 0 2px 8px rgba(52,152,219,0.08);
                cursor: pointer;
                z-index: 1020;
                border: 1px solid #3498db;

            }
            #save-btn:hover {
                background: #3498db;
                color: #fff;
            }
        `;
            document.head.appendChild(style);
        })();
        // 悬浮球样式和交互
        (function() {
            const style = document.createElement('style');
        style.innerHTML = `
            #floating-ball {
                position: fixed;
                right: 32px;
                bottom: 32px;
                width: 60px;
                height: 60px;
                background: rgba(149, 165, 166, 0.7);

                -webkit-backdrop-filter: blur(15px);
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
                cursor: pointer;
                z-index: 1010;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
            }
            #floating-ball:hover {
                transform: scale(1.18);
                background: rgba(149, 165, 166, 0.8);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            }
            #floating-ball::after {
                content: '搞';
                font-size: 2.2rem;
                color: #333;
                pointer-events: none;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            }
            #operation-modal .modal-content {
                min-width: 320px;
            }
        `;
            document.head.appendChild(style);
        })();

        document.addEventListener('DOMContentLoaded', function() {
            // 应用自适应文字颜色（仅初始应用一次）
            applyAdaptiveTextColors();

            // 公告居中弹窗显示逻辑
            function showCenterNotice() {
                const notice = localStorage.getItem('notice') || '';
                if (notice.trim()) {
                    document.getElementById('notice-center-text').textContent = notice;
                    document.getElementById('notice-center-modal').style.display = 'flex';
                }
            }
            function hideCenterNotice() {
                document.getElementById('notice-center-modal').style.display = 'none';
            }
            // 公告弹窗关闭事件
            document.getElementById('notice-center-close').addEventListener('click', hideCenterNotice);
            document.getElementById('notice-center-modal').addEventListener('click', function(e) {
                if (e.target === this) hideCenterNotice();
            });

    // 渲染指定科目的作业
        function renderHomework(subject) {
            const container = document.getElementById(`${subject}-homework`);
            const row = container.closest('tr'); // 获取包含该科目的整行
            const homeworks = JSON.parse(localStorage.getItem(subject));
            
            container.innerHTML = '';
            
            if (homeworks.length === 0) {
                // 如果没有作业，隐藏整行
                row.classList.add('hidden');
                return;
            }
            
            // 有作业时显示整行
            row.classList.remove('hidden');
            
            homeworks.forEach((homework, index) => {
                const homeworkItem = document.createElement('div');
                homeworkItem.className = 'homework-item';
                homeworkItem.textContent = `${index + 1}. ${homework}`;
                container.appendChild(homeworkItem);
            });
        }
        
        // 检查是否需要紧凑显示
        function checkCompactView() {
            const table = document.querySelector('.homework-table');
            const tableHeight = table.offsetHeight;
            const windowHeight = window.innerHeight;
            
            if (tableHeight > windowHeight * 0.8) {
                document.querySelectorAll('.homework-items-container').forEach(container => {
                    container.classList.add('compact');
                });
            } else {
                document.querySelectorAll('.homework-items-container').forEach(container => {
                    container.classList.remove('compact');
                });
            }
        }
        
        // 更新作业项选择框
        function updateHomeworkItems(subjectSelectId, itemSelectId) {
            const subject = document.getElementById(subjectSelectId).value;
            const homeworks = JSON.parse(localStorage.getItem(subject));
            const itemSelect = document.getElementById(itemSelectId);
            
            itemSelect.innerHTML = '';
            
            if (homeworks.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '暂无作业';
                itemSelect.appendChild(option);
                return;
            }
            
            homeworks.forEach((homework, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `作业 ${index + 1}`;
                itemSelect.appendChild(option);
            });
            
            // 默认选择第一项并更新内容（如果是修改模态框）
            if (itemSelectId === 'homework-item-select') {
                itemSelect.value = 0;
                document.getElementById('modify-homework-input').value = homeworks[0];
            }
        }

                subjects.forEach(subject => {
                    const homeworks = JSON.parse(localStorage.getItem(subject));
                    content += `【${subjectNames[subject]}】\n`;
                    
                    if (homeworks.length === 0) {
                        content += "  暂无作业\n";
                    } else {
                        homeworks.forEach((homework, index) => {
                            content += `  ${index + 1}. ${homework}\n`;
                        });
                    }
                    
                    content += "\n";
                });
            }
            
            // 保存公告内容
            if (saveNotice) {
                const notice = localStorage.getItem('notice') || '';
                if (notice.trim()) {
                    content += "【公告】\n";
                    content += `  ${notice}\n\n`;
                }
            }
            
            // 创建下载链接
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const filename = `${year}${month}${day}_homework.txt`;
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // 检查并清空每日数据
        function checkAndClearDailyData() {
            const today = new Date().toDateString();
            const lastClearDate = localStorage.getItem('lastClearDate');
            
            if (lastClearDate !== today) {
                const subjects = [
                    'chinese', 'math', 'english', 'physics', 'chemistry', 
                    'biology', 'politics', 'history', 'geography', 'other'
                ];
                
                // 清空所有科目数据
                subjects.forEach(subject => {
                    localStorage.setItem(subject, JSON.stringify([]));
                });
                
                // 记录清空日期
                localStorage.setItem('lastClearDate', today);
            }
        }

        // 模态框动画控制
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = modal.querySelector('.modal-content');
            if (content) {
                content.classList.remove('is-static');
            }
            modal.style.display = 'flex';
            // 强制重排以触发动画
            modal.offsetHeight;
            modal.classList.add('show');

            if (content) {
                const onTransitionEnd = function(e) {
                    if (e.propertyName === 'transform') {
                        content.classList.add('is-static');
                        content.removeEventListener('transitionend', onTransitionEnd);
                    }
                };
                content.addEventListener('transitionend', onTransitionEnd);
            }
        }

        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = modal.querySelector('.modal-content');
            if (content) {
                content.classList.remove('is-static');
            }
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // 更新所有模态框显示逻辑以使用动画
        document.addEventListener('DOMContentLoaded', function() {
            // 更新公告居中弹窗显示逻辑
            function showCenterNotice() {
                const notice = localStorage.getItem('notice') || '';
                if (notice.trim()) {
                    document.getElementById('notice-center-text').textContent = notice;
                    showModal('notice-center-modal');
                }
            }

            function hideCenterNotice() {
                hideModal('notice-center-modal');
            }

            // 更新其他模态框显示逻辑
            document.getElementById('save-btn').addEventListener('click', function() {
                showModal('save-select-modal');
            });

            document.getElementById('floating-ball').addEventListener('click', function() {
                showModal('operation-modal');
            });

            // 更新所有模态框关闭逻辑
            document.querySelectorAll('.close-button').forEach(button => {
                button.addEventListener('click', function() {
                    const modal = this.closest('.modal');
                    hideModal(modal.id);
                });
            });

            // 更新取消按钮逻辑
            document.getElementById('add-cancel-button').addEventListener('click', function() {
                hideModal('add-homework-modal');
            });
            document.getElementById('modify-cancel-button').addEventListener('click', function() {
                hideModal('modify-homework-modal');
            });
            document.getElementById('delete-cancel-button').addEventListener('click', function() {
                hideModal('delete-homework-modal');
            });
            document.getElementById('save-cancel-button').addEventListener('click', function() {
                hideModal('save-confirm-modal');
            });
            document.getElementById('notice-cancel').addEventListener('click', function() {
                hideModal('notice-modal');
            });
            document.getElementById('operation-close').addEventListener('click', function() {
                hideModal('operation-modal');
            });

            // 更新操作对话框按钮事件
            document.getElementById('op-add').addEventListener('click', function() {
                hideModal('operation-modal');
                setTimeout(() => showModal('add-homework-modal'), 300);
            });
            document.getElementById('op-modify').addEventListener('click', function() {
                hideModal('operation-modal');
                setTimeout(() => {
                    updateHomeworkItems('modify-subject-select', 'homework-item-select');
                    showModal('modify-homework-modal');
                }, 300);
            });
            document.getElementById('op-delete').addEventListener('click', function() {
                hideModal('operation-modal');
                setTimeout(() => {
                    updateHomeworkItems('delete-subject-select', 'delete-item-select');
                    showModal('delete-homework-modal');
                }, 300);
            });

            // 更新原有按钮事件
            document.getElementById('add-homework-btn').addEventListener('click', function() {
                showModal('add-homework-modal');
            });
            document.getElementById('modify-homework-btn').addEventListener('click', function() {
                updateHomeworkItems('modify-subject-select', 'homework-item-select');
                showModal('modify-homework-modal');
            });
            document.getElementById('delete-homework-btn').addEventListener('click', function() {
                updateHomeworkItems('delete-subject-select', 'delete-item-select');
                showModal('delete-homework-modal');
            });

            // 更新点击外部关闭逻辑
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        hideModal(this.id);
                    }
                });
            });

            // 更新键盘事件
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const openModals = document.querySelectorAll('.modal.show');
                    if (openModals.length > 0) {
                        hideModal(openModals[openModals.length - 1].id);
                    }
                }
            });
        });

    </script>
</body>
