<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业王v1.4.9</title>
    <link rel="icon" href="ico.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">作业王v1.4.9-大家的最爱</div>
    <!-- 公告展示区 -->
    <div id="notice-display" style="display:none;"></div>
    <!-- 公告居中弹窗 -->
    <div id="notice-center-modal">
        <div class="modal-content" style="padding:32px 28px;max-width:480px;">
            <button id="notice-center-close" style="position:absolute;top:18px;right:18px;">&times;</button>
            <h2 style="font-size:1.35rem;color:white;margin-bottom:18px;text-shadow:0 2px 4px rgba(0,0,0,0.3);">公告</h2>
            <div id="notice-center-text" style="font-size:1.15rem;color:white;word-break:break-all;white-space:pre-wrap;text-shadow:0 1px 2px rgba(0,0,0,0.3);"></div>
        </div>
    </div>
    <!-- 右上角保存按钮 -->
    <div id="top-btns">
        <button id="save-btn" class="action-button">保存</button>
    </div>
    
    <!-- 保存选择对话框 -->
    <div class="modal" id="save-select-modal">
        <div class="modal-content" style="width:340px;">
            <div class="modal-header">
                <h2 class="modal-title">保存选项</h2>
                <button class="close-button" id="save-select-close">&times;</button>
            </div>
            <div class="form-group" style="padding:15px 0;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="save-homework-checkbox" checked style="width:18px;height:18px;">
                    <span>保存作业内容</span>
                </label>
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:10px;">
                    <input type="checkbox" id="save-notice-checkbox" checked style="width:18px;height:18px;">
                    <span>保存公告内容</span>
                </label>
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:10px;">
                    <input type="checkbox" id="save-clear-after-checkbox" style="width:18px;height:18px;">
                    <span>保存后清空</span>
                </label>
            </div>
            <div class="modal-footer" style="flex-direction:row;justify-content:center;gap:20px;">
                <button class="cancel-button" id="save-select-cancel">取消</button>
                <button class="submit-button" id="save-select-confirm">确定保存</button>
            </div>
        </div>
    </div>

    <!-- 保存确认对话框 -->
    <div class="modal" id="save-confirm-modal">
        <div class="modal-content" style="width:340px;">
            <div class="modal-header">
                <h2 class="modal-title">保存确认</h2>
                <button class="close-button" id="save-confirm-close">&times;</button>
            </div>
            <div class="form-group" style="text-align:center;padding:20px 0;">
                <p style="font-size:1.1rem;color:white;margin:0;text-shadow:0 1px 2px rgba(0,0,0,0.3);">确定要保存作业到文件吗？</p>
            </div>
            <div class="modal-footer" style="flex-direction:row;justify-content:center;gap:20px;">
                <button class="cancel-button" id="save-cancel-button">取消</button>
                <button class="submit-button" id="save-confirm-button">确定保存</button>
            </div>
        </div>
    </div>
    <!-- 左下角公告按钮 -->
    <div id="bottom-notice-btn">公告</div>
    <!-- 公告写字板模态框 -->
    <div class="modal" id="notice-modal">
        <div class="modal-content" style="width:640px;min-height:400px;max-width:700px;">
            <div class="modal-header">
                <h2 class="modal-title" style="flex:1;">公告编辑</h2>
                <button class="markdown-example-btn" id="markdown-example-btn">Markdown示例</button>
                <button class="close-button" id="notice-close">&times;</button>
            </div>
            <div class="form-group">
                <label for="notice-textarea">公告内容（最多3000字符）</label>
                <textarea id="notice-textarea" maxlength="3000" style="width:100%;height:200px;resize:vertical;font-size:1.1rem;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:white;"></textarea>
                <div id="notice-count" style="text-align:right;color:rgba(255,255,255,0.7);font-size:0.95rem;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,0.3);">0/3000</div>
            </div>
            <div class="modal-footer">
                <button class="submit-button" id="notice-save">保存公告</button>
                <button class="cancel-button" id="notice-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Markdown示例弹窗 -->
    <div class="modal" id="markdown-example-modal">
        <div class="modal-content" style="width:780px;min-height:460px;max-width:95vw;">
            <div class="modal-header">
                <h2 class="modal-title">Markdown示例</h2>
                <button class="close-button" id="markdown-example-close">&times;</button>
            </div>
            <div class="markdown-example-container">
                <div class="markdown-example-left">
                    <textarea readonly style="width:100%;height:420px;font-family:Consolas,monospace;font-size:0.95rem;padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);color:#e0f0ff;resize:none;"></textarea>
                </div>
                <div class="markdown-example-right" style="padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);color:white;overflow-y:auto;height:420px;">
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮球 -->
    <div id="floating-ball"></div>

    <!-- 操作选择对话框 -->
    <div class="modal" id="operation-modal">
        <div class="modal-content" style="width:340px;">
            <div class="modal-header">
                <h2 class="modal-title">选择操作</h2>
                <button class="close-button" id="operation-close">&times;</button>
            </div>
            <div class="modal-footer" style="flex-direction:column;align-items:stretch;gap:15px;">
                <button class="action-button add-button" id="op-add">添加作业</button>
                <button class="action-button modify-button" id="op-modify">修改作业</button>
                <button class="action-button delete-button" id="op-delete">删除作业</button>
                <button class="action-button manage-button" id="op-manage">管理</button>
            </div>
        </div>
    </div>

    <!-- 管理对话框 -->
    <div class="modal" id="manage-modal">
        <div class="modal-content" style="width:420px;min-height:320px;max-width:480px;">
            <div class="modal-header">
                <h2 class="modal-title">管理设置 <a href="javascript:void(0)" id="about-link" style="font-size:0.75rem;font-weight:normal;color:rgba(255,255,255,0.6);text-decoration:none;margin-left:8px;">关于</a></h2>
                <button class="close-button" id="manage-close">&times;</button>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="manage-ad-toggle-checkbox" style="width:18px;height:18px;">
                    <span>广告开关</span>
                </label>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="manage-liquid-glass-toggle-checkbox" style="width:18px;height:18px;">
                    <span>liquid glass开关</span>
                </label>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="manage-bottom-display-checkbox" style="width:18px;height:18px;">
                    <span>靠下显示</span>
                </label>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="manage-daily-clear-checkbox" style="width:18px;height:18px;">
                    <span>每日清空</span>
                </label>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="manage-easter-egg-checkbox" style="width:18px;height:18px;">
                    <span>彩蛋</span>
                </label>
                <div id="manage-messy-stew-group" style="margin-top:12px;margin-left:28px;display:none;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                        <input type="checkbox" id="manage-messy-stew-checkbox" style="width:18px;height:18px;">
                        <span>大乱炖</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="submit-button" id="manage-save">保存设置</button>
                <button class="cancel-button" id="manage-cancel">取消</button>
            </div>
        </div>
    </div>

    <table class="homework-table">
        <tr>
            <th>科目</th>
            <th>作业内容</th>
        </tr>
        <tr>
            <td class="subject-cell">语文</td>
            <td id="chinese-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">数学</td>
            <td id="math-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">英语</td>
            <td id="english-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">物理</td>
            <td id="physics-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">化学</td>
            <td id="chemistry-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">生物</td>
            <td id="biology-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">政治</td>
            <td id="politics-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">历史</td>
            <td id="history-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">地理</td>
            <td id="geography-homework" class="homework-items-container"></td>
        </tr>
        <tr>
            <td class="subject-cell">其他</td>
            <td id="other-homework" class="homework-items-container"></td>
        </tr>
    </table>
    
    <div class="button-container" style="display:none;">
        <button class="action-button add-button" id="add-homework-btn">添加作业</button>
        <button class="action-button modify-button" id="modify-homework-btn">修改作业</button>
        <button class="action-button delete-button" id="delete-homework-btn">删除作业</button>
    </div>
    
    <!-- 添加作业模态框 -->
    <div class="modal" id="add-homework-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">添加新作业</h2>
                <button class="close-button">&times;</button>
            </div>
            <div class="form-group">
                <label for="subject-select">选择科目</label>
                <select id="subject-select">
                    <option value="chinese">语文</option>
                    <option value="math">数学</option>
                    <option value="english">英语</option>
                    <option value="physics">物理</option>
                    <option value="chemistry">化学</option>
                    <option value="biology">生物</option>
                    <option value="politics">政治</option>
                    <option value="history">历史</option>
                    <option value="geography">地理</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="homework-input">作业内容</label>
                <input type="text" id="homework-input" placeholder="请输入作业内容">
                <div class="quick-preset-buttons" id="quick-preset-buttons">
                    <button class="preset-button" data-text="选考">选考</button>
                    <button class="preset-button" data-text="学考">学考</button>
                    <button class="preset-button" data-text="全品">全品</button>
                    <button class="preset-button" data-text="高效作业">高效作业</button>
                    <button class="preset-button" data-text="步步高">步步高</button>
                    <button class="preset-button" data-text="大本">大本</button>
                    <button class="preset-button" data-text="小本">小本</button>
                    <button class="preset-button" data-text="赢在微点">赢在微点</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-button" id="add-cancel-button">取消</button>
                <button class="submit-button" id="submit-homework">确定</button>
            </div>
        </div>
    </div>
    
    <!-- 修改作业模态框 -->
    <div class="modal" id="modify-homework-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">修改作业</h2>
                <button class="close-button">&times;</button>
            </div>
            <div class="form-group">
                <label for="modify-subject-select">选择科目</label>
                <select id="modify-subject-select">
                    <option value="chinese">语文</option>
                    <option value="math">数学</option>
                    <option value="english">英语</option>
                    <option value="physics">物理</option>
                    <option value="chemistry">化学</option>
                    <option value="biology">生物</option>
                    <option value="politics">政治</option>
                    <option value="history">历史</option>
                    <option value="geography">地理</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="homework-item-select">选择作业项</label>
                <select id="homework-item-select"></select>
            </div>
            <div class="form-group">
                <label for="modify-homework-input">作业内容</label>
                <input type="text" id="modify-homework-input" placeholder="请输入修改后的作业内容">
            </div>
            <div class="modal-footer">
                <button class="cancel-button" id="modify-cancel-button">取消</button>
                <button class="submit-button" id="submit-modify">确定</button>
            </div>
        </div>
    </div>
    
    <!-- 删除作业模态框 -->
    <div class="modal" id="delete-homework-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">删除作业</h2>
                <button class="close-button">&times;</button>
            </div>
            <div class="form-group">
                <label for="delete-subject-select">选择科目</label>
                <select id="delete-subject-select">
                    <option value="chinese">语文</option>
                    <option value="math">数学</option>
                    <option value="english">英语</option>
                    <option value="physics">物理</option>
                    <option value="chemistry">化学</option>
                    <option value="biology">生物</option>
                    <option value="politics">政治</option>
                    <option value="history">历史</option>
                    <option value="geography">地理</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="delete-item-select">选择作业项</label>
                <select id="delete-item-select"></select>
            </div>
            <div class="modal-footer">
                <button class="cancel-button" id="delete-cancel-button">取消</button>
                <button class="delete-confirm-button" id="confirm-delete">删除作业</button>
            </div>
        </div>
    </div>

    <!-- 关于/友链弹窗 -->
    <div class="modal" id="about-modal">
        <div class="modal-content" style="width:400px;">
            <div class="modal-header">
                <h2 class="modal-title">关于</h2>
                <button class="close-button" id="about-close">&times;</button>
            </div>
            <div class="form-group" style="padding:20px 0;">
                <p style="color:white;font-size:1.05rem;margin-bottom:16px;text-shadow:0 1px 2px rgba(0,0,0,0.3);">友链</p>
                <p style="margin-bottom:12px;"><a href="https://hglp.lhdyx.top" target="_blank" style="color:#4da6ff;text-decoration:none;font-size:1rem;">小游戏</a></p>
                <p style="margin-bottom:12px;"><a href="https://78.91vip.tv/home.html" target="_blank" style="color:#4da6ff;text-decoration:none;font-size:1rem;">窑子开张了</a></p>
            </div>
            <div class="modal-footer">
                <button class="submit-button" id="about-ok">确定</button>
            </div>
        </div>
    </div>

    <div class="footer-image" id="ad-container" style="display:none;">
        <img id="ad-image" alt="广告图片">
    </div>

    <script src="app.js"></script>
</body>
</html>
